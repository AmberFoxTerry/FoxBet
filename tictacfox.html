<!DOCTYPE html>

<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>TicTacFox - FoxBet</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<header class="top-bar">

<div class="logo">
    &gt; FoxBet
</div>

<div class="balance">
    <span id="balance">...</span>
    <span>FoxCoins</span>
</div>

</header>

<!-- EXIT -->

<button class="exit-arrow" onclick="window.location.href='index.html'">
    ←
</button>

<main class="tictacfox">

<h1>TicTacFox</h1>

<p class="description">
    Reveal the tiles. Find a matching line. Win FoxCoins.
</p>


<!-- BETS -->

<div class="bets">

    <button data-bet="2">2 FC</button>
    <button data-bet="10">10 FC</button>
    <button data-bet="50">50 FC</button>
    <button data-bet="100">100 FC</button>

</div>


<div class="selected-bet">
    Selected bet:
    <span>None</span>
</div>


<button id="buy-ticket">
    Buy Ticket
</button>


<!-- BOARD -->

<div class="board-wrapper">

    <div class="grid">

        <button class="cell" data-index="0"></button>
        <button class="cell" data-index="1"></button>
        <button class="cell" data-index="2"></button>

        <button class="cell" data-index="3"></button>
        <button class="cell" data-index="4"></button>
        <button class="cell" data-index="5"></button>

        <button class="cell" data-index="6"></button>
        <button class="cell" data-index="7"></button>
        <button class="cell" data-index="8"></button>

    </div>


    <!-- WIN OVERLAY -->

    <div class="win-overlay">

        <div class="win-title">
            YOU WIN!
        </div>

        <div class="win-amount">
            +0 FC
        </div>

    </div>

</div>


<div class="result">
    Choose your bet.
</div>


<button class="play-again">
    New Ticket
</button>

</main>

<!-- GAME SCRIPT -->

<script src="tictacfox.js"></script>

</body>
</html>
