<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TicTacFox</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">
    <div class="logo" onclick="location.href='index.html'">
        &gt; FoxBet
    </div>

    <div class="balance">
        <span id="balance">200</span> <span>FoxCoins</span>
    </div>
</header>

<main class="tictacfox">

    <h1>TicTacFox</h1>
    <p class="description">Click symbols. Line wins.</p>

    <div class="bets">
        <button onclick="setBet(2)">2 FC</button>
        <button onclick="setBet(10)">10 FC</button>
        <button onclick="setBet(50)">50 FC</button>
        <button onclick="setBet(100)">100 FC</button>
    </div>

    <div class="selected-bet">
        Bet: <span id="bet">2</span> FC
    </div>

    <div id="grid" class="grid"></div>

    <div id="result" class="result">
        Choose a bet and click the grid!
    </div>

</main>

<script>
let balance = Number(localStorage.getItem("foxcoins"));

if (isNaN(balance)) {
    balance = 200;
    localStorage.setItem("foxcoins", balance);
}

let bet = 2;
let gameOver = false;

const symbols = [
    { symbol: "♥️", chance: 50, multiplier: 0.5 },
    { symbol: "🔥", chance: 25, multiplier: 1 },
    { symbol: "⭐", chance: 15, multiplier: 2 },
    { symbol: "🌙", chance: 9, multiplier: 2.5 },
    { symbol: "🦊", chance: 1, multiplier: 5 }
];

const grid = document.getElementById("grid");
const balanceText = document.getElementById("balance");
const betText = document.getElementById("bet");
const result = document.getElementById("result");

function updateBalance() {
    balanceText.textContent = balance;
    localStorage.setItem("foxcoins", balance);
}

function setBet(amount) {
    if (gameOver) return;

    bet = amount;
    betText.textContent = amount;
}

function randomSymbol() {
    const roll = Math.random() * 100;
    let total = 0;

    for (const item of symbols) {
        total += item.chance;

        if (roll < total) {
            return item;
        }
    }

    return symbols[0];
}

function startGame() {
    if (balance < bet) {
        result.textContent = "Not enough FoxCoins! 😭";
        return;
    }

    balance -= bet;
    updateBalance();

    gameOver = false;
    result.textContent = "Click the squares!";

    grid.innerHTML = "";

    for (let i = 0; i < 9; i++) {
        const cell = document.createElement("button");

        cell.className = "cell";
        cell.textContent = "?";

        cell.onclick = () => revealCell(cell);

        grid.appendChild(cell);
    }
}

function revealCell(cell) {
    if (cell.dataset.revealed) return;

    const item = randomSymbol();

    cell.textContent = item.symbol;
    cell.dataset.revealed = "true";
}

function checkLines() {
    const cells = [...document.querySelectorAll(".cell")];

    const lines = [
        [0,1,2],
        [3,4,5],
        [6,7,8],

        [0,3,6],
        [1,4,7],
        [2,5,8],

        [0,4,8],
        [2,4,6]
    ];

    for (const line of lines) {
        const values = line.map(i => cells[i].textContent);

        if (
            values[0] !== "?" &&
            values[0] === values[1] &&
            values[1] === values[2]
        ) {
            return values[0];
        }
    }

    return null;
}

function revealCell(cell) {
    if (cell.dataset.revealed || gameOver) return;

    const item = randomSymbol();

    cell.textContent = item.symbol;
    cell.dataset.revealed = "true";

    const winner = checkLines();

    if (winner) {
        const symbolData = symbols.find(s => s.symbol === winner);
        const winnings = bet * symbolData.multiplier;

        balance += winnings;
        updateBalance();

        result.textContent =
            `${winner}${winner}${winner} — You won ${winnings} FC! 🦊`;

        gameOver = true;
    }
}

grid.addEventListener("click", () => {
    if (
        !gameOver &&
        document.querySelectorAll(".cell[data-revealed]").length === 0
    ) {
        // First click starts the game
    }
});

startGame();
</script>

</body>
</html>
