</main>

<script>

    const balanceElement =
        document.getElementById(
            "balance"
        );


    /* =========================
       PLAYER ID
    ========================= */

    let playerId =
        localStorage.getItem(
            "foxbet_player_id"
        );


    if (!playerId) {

        playerId =
            crypto.randomUUID();

        localStorage.setItem(
            "foxbet_player_id",
            playerId
        );
    }



    /* =========================
       SERVER CONNECTION
    ========================= */

    const ws =
        new WebSocket(
            "wss://foxbet.onrender.com"
        );



    ws.onopen = () => {

        ws.send(
            JSON.stringify({

                type: "identify",

                playerId:
                    playerId

            })
        );

    };



    ws.onmessage = (event) => {

        const data =
            JSON.parse(
                event.data
            );


        if (
            data.type ===
            "balance"
        ) {

            balanceElement.textContent =
                data.balance;
        }

    };

</script>
