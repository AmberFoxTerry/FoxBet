<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>FoxBet</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

<header class="top-bar">

    <div class="logo">
        &gt; FoxBet
    </div>

    <div class="balance">
        <span id="balance">200</span>
        <span>FoxCoins</span>
    </div>

</header>


<main class="games">

    <a href="tictacfox.html" class="game-card">
        <h2>TicTacFox</h2>
        <p>Play now</p>
    </a>

    <div class="game-card">
        <h2>Coming Soon</h2>
        <p>More games...</p>
    </div>

    <div class="game-card">
        <h2>Coming Soon</h2>
        <p>More games...</p>
    </div>

    <div class="game-card">
        <h2>Coming Soon</h2>
        <p>More games...</p>
    </div>

</main>


<script>
    const balanceElement =
        document.getElementById("balance");

    const ws = new WebSocket("wss://foxbet.onrender.com");

    ws.onmessage = (event) => {

        const data = JSON.parse(event.data);

        if (data.type === "balance") {
            balanceElement.textContent = data.balance;
        }

    };
</script>
</body>
</html>
